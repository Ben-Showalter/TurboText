plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing credentials live in keystore.properties, NOT here — that file
// stays out of git (see .gitignore) since it holds real passwords and a
// path to the keystore itself. This block just loads it if present, so
// a release build works locally but the repo carries no secrets. If the
// file's missing (e.g. someone else clones the repo without their own
// keystore), release builds simply fall back to unsigned rather than
// failing the whole build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.turbotext.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.turbotext.app"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // MMS (picture message) *sending* — composes and sends the MMS PDU via
    // the SDK21+ system MmsManager. See README for the receiving-side caveat.
    implementation 'com.klinkerapps:android-smsmms:5.2.6'

    // For Groq's Whisper API (cloud voice-to-text) — 4.x rather than the
    // newer 5.x line, which split into separate JVM/Android artifacts and
    // isn't worth the added Gradle-resolution risk for what we need here.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
