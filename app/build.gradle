plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing credentials live in keystore.properties, NOT here — that file
// stays out of git (see .gitignore) since it holds real passwords and a
// path to the keystore itself. This block just loads it if present, so
// a release build works locally but the repo carries no secrets. If the
// file's missing (e.g. someone else clones the repo without their own
// keystore), release builds simply fall back to unsigned rather than
// failing the whole build.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.turbotext.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.turbotext.app"
        minSdk 24
        targetSdk 33
        // Every published release needs a higher versionCode and must be
        // signed with the same release key, or phones refuse the in-app
        // update. versionName must match the release tag (v.1.0.4 or
        // v1.0.4 -> "1.0.4").
        versionCode 3
        versionName "1.0.4"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // MMS send + receive: PDU building/parsing, the WAP-push receiver and
    // download-complete handling. Vendored FossifyOrg/mmslib (the
    // maintained fork of com.klinkerapps:android-smsmms) — see mmslib/NOTICE.
    implementation project(':mmslib')

    // Re-encodes video attachments small enough to fit the carrier's MMS
    // size limit (see VideoCompressor).
    implementation 'androidx.media3:media3-transformer:1.4.1'
    implementation 'androidx.media3:media3-effect:1.4.1'
    implementation 'androidx.media3:media3-common:1.4.1'

    // For Groq's Whisper API (cloud voice-to-text) — 4.x rather than the
    // newer 5.x line, which split into separate JVM/Android artifacts and
    // isn't worth the added Gradle-resolution risk for what we need here.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
